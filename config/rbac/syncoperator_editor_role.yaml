# This rule is not used by the project label-sync-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.dev.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: label-sync-operator
    app.kubernetes.io/managed-by: kustomize
  name: syncoperator-editor-role
rules:
- apiGroups:
  - apps.dev.com
  resources:
  - syncoperators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.dev.com
  resources:
  - syncoperators/status
  verbs:
  - get
